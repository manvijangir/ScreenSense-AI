<script type="text/babel">

const { useState, useEffect, useRef } = React;

/* ============================================================
   LOCAL DATABASE
   Beginner replacement for Supabase
============================================================ */

const DB = {
  users: JSON.parse(localStorage.getItem("ss_users") || "[]"),
  saveUsers() {
    localStorage.setItem("ss_users", JSON.stringify(this.users));
  }

function getCurrentUser() {

  } else {
    localStorage.removeItem("ss_current_user");
  }
}

/* ============================================================
   CSV PARSER
============================================================ */

function parseCSV(text) {

  const lines = text.trim().split(/\r?\n/);

  if (lines.length < 2) {
    throw new Error("CSV file does not contain enough data.");
  }

  const headers = lines[0]
    .split(",")
    .map(h => h.trim().toLowerCase());

  const rows = lines.slice(1).map(line => {

    const values = line.split(",");

    const row = {};

    headers.forEach((header, index) => {
      row[header] = values[index] ? values[index].trim() : "";
    });

    return row;
  });

  return rows;
}

/* ============================================================
   SCREEN TIME ANALYZER
============================================================ */

function analyzeScreenTime(rows) {

  let totalMinutes = 0;
  let socialMinutes = 0;
  let entertainmentMinutes = 0;
  let studyMinutes = 0;

  const appUsage = {};

  rows.forEach(row => {

    const app =
      row.app ||
      row.application ||
      row.name ||
      "Unknown";

    const minutes = Number(
      row.minutes ||
      row.duration ||
      row.screen_time ||
      0
    );

    if (isNaN(minutes)) return;

    totalMinutes += minutes;

    appUsage[app] = (appUsage[app] || 0) + minutes;

    const lower = app.toLowerCase();

    if (
      lower.includes("instagram") ||
      lower.includes("facebook") ||
      lower.includes("snapchat") ||
      lower.includes("tiktok") ||
      lower.includes("social") ||
      lower.includes("whatsapp")
    ) {
      socialMinutes += minutes;
    }

    if (
      lower.includes("youtube") ||
      lower.includes("netflix") ||
      lower.includes("game") ||
      lower.includes("entertainment")
    ) {
      entertainmentMinutes += minutes;
    }

    if (
      lower.includes("study") ||
      lower.includes("google") ||
      lower.includes("coursera") ||
      lower.includes("udemy") ||
      lower.includes("leetcode")
    ) {
      studyMinutes += minutes;
    }

  });

  const sortedApps = Object.entries(appUsage)
    .sort((a,b) => b[1] - a[1]);

  const topApp = sortedApps[0] || ["Unknown", 0];

  return {
    totalMinutes,
    socialMinutes,
    entertainmentMinutes,
    studyMinutes,
    appUsage,
    sortedApps,
    topApp
  };
}

/* ============================================================
   AI STUDENT COACH
============================================================ */

function generateInsights(data, goal) {

  const insights = [];

  const totalHours = data.totalMinutes / 60;

  if (data.socialMinutes > 120) {

    insights.push({
      icon: "📱",
      title: "Social media is taking a large part of your day",
      text:
        `You spent around ${Math.round(data.socialMinutes / 60)} hours on social apps. Try reducing this by 30–45 minutes and convert that time into focused work.`
    });

  } else {

    insights.push({
      icon: "👍",
      title: "Your social media usage is relatively controlled",
      text:
        "Keep the habit consistent and protect your distraction-free study/work periods."
    });

  }

  if (data.studyMinutes < 60) {

    insights.push({
      icon: "📚",
      title: "Increase productive screen time",
      text:
        "Consider replacing some entertainment time with coding, reading, courses, or project work."
    });

  } else {

    insights.push({
      icon: "🚀",
      title: "Good productive usage",
      text:
        "You are already using part of your screen time productively. Build a consistent daily learning routine."
    });

  }

  if (data.entertainmentMinutes > 120) {

    insights.push({
      icon: "🎮",
      title: "Entertainment usage is high",
      text:
        "Set an entertainment limit and use the recovered time for your main goal."
    });

  }

  if (goal) {

    insights.push({
      icon: "🎯",
      title: `Your goal: ${goal}`,
      text:
        `A realistic first step is to recover 30–60 minutes from unnecessary scrolling and dedicate it to ${goal}.`
    });

  }

  if (totalHours > 8) {

    insights.push({
      icon: "⏰",
      title: "Your total screen time is high",
      text:
        "Create phone-free blocks during study, work, meals, and before sleeping."
    });

  }

  return insights;
}

/* ============================================================
   AUTH
============================================================ */

function Auth({ mode, setPage, setUser }) {

  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");

  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  function submit(e) {

    e.preventDefault();

    setError("");

    if (!email || !password) {
      setError("Please enter email and password.");
      return;
    }

    if (password.length < 6) {
      setError("Password must contain at least 6 characters.");
      return;
    }

    setLoading(true);

    setTimeout(() => {

      if (mode === "signup") {

        if (!name) {
          setError("Please enter your name.");
          setLoading(false);
          return;
        }

        const exists = DB.users.find(
          u => u.email === email
        );

        if (exists) {
          setError("An account with this email already exists.");
          setLoading(false);
          return;
        }

        const user = {
          id: Date.now(),
          name,
          email,
          password
        };

        DB.users.push(user);
        DB.saveUsers();

        setCurrentUser(user);
        setUser(user);
        setPage("dashboard");

      } else {

        const user = DB.users.find(
          u => u.email === email &&
               u.password === password
        );

        if (!user) {
          setError("Invalid email or password.");
          setLoading(false);
          return;
        }

        setCurrentUser(user);
        setUser(user);
        setPage("dashboard");

      }

    }, 700);
  }

  return (

    <div className="auth-page">

      <form className="auth-card" onSubmit={submit}>

        <h2>
          {mode === "login"
            ? "Welcome back 👋"
            : "Create your account 🚀"}
        </h2>

        <p>
          {mode === "login"
            ? "Continue improving your digital habits."
            : "Start understanding where your time goes."}
        </p>

        {error && (
          <div className="error">{error}</div>
        )}

        {mode === "signup" && (

          <div className="form-group">

            <label>Name</label>

            <input
              className="input"
              placeholder="Your name"
              value={name}
              onChange={e => setName(e.target.value)}
            />

          </div>

        )}

        <div className="form-group">

          <label>Email</label>

          <input
            className="input"
            type="email"
            placeholder="you@example.com"
            value={email}
            onChange={e => setEmail(e.target.value)}
          />

        </div>

        <div className="form-group">

          <label>Password</label>

          <input
            className="input"
            type="password"
            placeholder="Minimum 6 characters"
            value={password}
            onChange={e => setPassword(e.target.value)}
          />

        </div>

        <button
          className="btn btn-primary"
          style={{width:"100%"}}
          disabled={loading}
        >
          {loading
            ? "Please wait..."
            : mode === "login"
              ? "Login"
              : "Create Account"}
        </button>

        <br />

        <button
          type="button"
          className="btn"
          style={{width:"100%"}}
          onClick={() =>
            setPage(mode === "login" ? "signup" : "login")
          }
        >
          {mode === "login"
            ? "Create new account"
            : "Already have an account?"}
        </button>

      </form>

    </div>
  );
}

   DASHBOARD
============================================================ */

function Dashboard({ user }) {

  const [data, setData] = useState(null);

  const [goal, setGoal] = useState(
    localStorage.getItem("ss_goal") || ""
  );

  const [loading, setLoading] = useState(false);

  const [tasks, setTasks] = useState([
    {
      text: "30 minutes focused study",
      done: false
    },
    {
      text: "Practice coding for 45 minutes",
      done: false
    },
    {
      text: "Keep social media below 1 hour",
      done: false
    }
  ]);

  const chartRef = useRef(null);
  const chartInstance = useRef(null);

  function saveGoal() {

    if (!goal.trim()) return;

    localStorage.setItem("ss_goal", goal);

    alert("Goal saved successfully!");

  }

  function handleFile(e) {

    const file = e.target.files[0];

    if (!file) return;

    if (!file.name.endsWith(".csv")) {
      alert("Please upload a CSV file.");
      return;
    }

    setLoading(true);

    const reader = new FileReader();

    reader.onload = event => {

      try {

        const rows = parseCSV(event.target.result);

        const analysis = analyzeScreenTime(rows);

        setData(analysis);

        localStorage.setItem(
          "ss_last_analysis",
          JSON.stringify(analysis)
        );

      } catch (err) {

        alert(err.message);

      }

      setLoading(false);

    };

    reader.readAsText(file);
  }

  useEffect(() => {

    const saved = localStorage.getItem("ss_last_analysis");

    if (saved) {
      setData(JSON.parse(saved));
    }

  }, []);

  useEffect(() => {

    if (!data || !chartRef.current) return;

    if (chartInstance.current) {
      chartInstance.current.destroy();
    }

    chartInstance.current = new Chart(
      chartRef.current,
      {
        type: "doughnut",

        data: {
          labels: Object.keys(data.appUsage),

          datasets: [{
            data: Object.values(data.appUsage)
          }]
        },

        options: {
          responsive: true,
          maintainAspectRatio: false
        }
      }
    );

  }, [data]);

  const insights = data
    ? generateInsights(data, goal)
    : [];

  return (

    <main className="dashboard">

      <div className="dashboard-header">

        <div>
          <h1>Hello, {user.name} 👋</h1>
          <p>Let's turn your screen time into productive time.</p>
        </div>

      </div>

      {/* UPLOAD */}

      <div className="card upload">

        <h2>📂 Upload Screen-Time CSV</h2>

        <p style={{
          color:"#667085",
          marginTop:"8px"
        }}>
          Upload your exported phone usage CSV and ScreenSense AI
          will analyze it automatically.
        </p>

        <input
          type="file"
          accept=".csv"
          onChange={handleFile}
        />

      </div>

      <br />

      {loading && (

        <div className="card loading">

          <div className="spinner"></div>

          <strong>Analyzing your screen time...</strong>

        </div>

      )}

      {data && !loading && (

        <>

          {/* STATS */}

          <div className="grid stats">

            <div className="card">

              <div className="stat-icon">⏱️</div>

              <div className="stat-title">
                Total Screen Time
              </div>

              <div className="stat-value">
                {Math.floor(data.totalMinutes / 60)}h{" "}
                {Math.round(data.totalMinutes % 60)}m
              </div>

            </div>

            <div className="card">

              <div className="stat-icon">📱</div>

              <div className="stat-title">
                Social Media
              </div>

              <div className="stat-value">
                {Math.floor(data.socialMinutes / 60)}h{" "}
                {Math.round(data.socialMinutes % 60)}m
              </div>

            </div>

            <div className="card">

              <div className="stat-icon">🎮</div>

              <div className="stat-title">
                Entertainment
              </div>

              <div className="stat-value">
                {Math.floor(data.entertainmentMinutes / 60)}h{" "}
                {Math.round(data.entertainmentMinutes % 60)}m
              </div>

            </div>

            <div className="card">

              <div className="stat-icon">📚</div>

              <div className="stat-title">
                Productive
              </div>

              <div className="stat-value">
                {Math.floor(data.studyMinutes / 60)}h{" "}
                {Math.round(data.studyMinutes % 60)}m
              </div>

            </div>

          </div>

          <br />

          {/* GOAL */}

          <div className="card">

            <h2>🎯 Your Future Goal</h2>

            <p style={{
              color:"#667085",
              margin:"7px 0 15px"
            }}>
              Tell ScreenSense AI what you want to achieve.
            </p>

            <div style={{
              display:"flex",
              gap:"10px",
              flexWrap:"wrap"
            }}>

              <input
                className="input"
                style={{flex:1}}
                placeholder="Example: Become an AI/ML engineer"
                value={goal}
                onChange={e => setGoal(e.target.value)}
              />

              <button
                className="btn btn-primary"
                onClick={saveGoal}
              >
                Save Goal
              </button>

            </div>

          </div>

          <br />

          <div className="grid two">

            {/* CHART */}

            <div className="card">

              <h2>📊 App Usage</h2>

              <div className="chart-container">

                <canvas ref={chartRef}></canvas>

              </div>

            </div>

            {/* TOP APPS */}

            <div className="card">

              <h2>🔥 Most Used Apps</h2>

              {data.sortedApps
                .slice(0,6)
                .map(([app, minutes]) => (

                <div
                  className="task"
                  key={app}
                >

                  <span>{app}</span>

                  <strong>
                    {Math.round(minutes)} min
                  </strong>

                </div>

              ))}

            </div>

          </div>

          <br />

          {/* AI INSIGHTS */}

          <div className="card">

            <h2>🤖 ScreenSense AI Coach</h2>

            <p style={{
              color:"#667085",
              marginTop:"5px"
            }}>
              Personalized insights generated from your usage.
            </p>

            {insights.map((item, index) => (

              <div
                className="insight"
                key={index}
              >

                <div style={{
                  fontSize:"25px"
                }}>
                  {item.icon}
                </div>

                <div>

                  <strong>{item.title}</strong>

                  <p style={{
                    color:"#667085",
                    lineHeight:"1.5"
                  }}>
                    {item.text}
                  </p>

                </div>

              </div>

            ))}

          </div>

          <br />

          {/* ACTION PLAN */}

          <div className="card">

            <h2>✅ Today's Action Plan</h2>

            <p style={{
              color:"#667085",
              marginTop:"5px"
            }}>
              Don't just analyze your screen time. Act on it.
            </p>

            {tasks.map((task,index) => (

              <div
                className={`task ${task.done ? "done" : ""}`}
                key={index}
              >

                <span>
                  {task.text}
                </span>

                <button
                  onClick={() => {

                    const updated = [...tasks];

                    updated[index].done =
                      !updated[index].done;

                    setTasks(updated);

                  }}
                >
                  {task.done ? "Done ✓" : "Complete"}
                </button>

              </div>

            ))}

          </div>

        </>

      )}

      {!data && !loading && (

        <div className="card">

          <h2>How it works</h2>

          <br />

          <p>1️⃣ Export your phone screen-time data.</p>
          <br />
          <p>2️⃣ Upload the CSV here.</p>
          <br />
          <p>3️⃣ ScreenSense analyzes your usage.</p>
          <br />
          <p>4️⃣ Set your future goal.</p>
          <br />
          <p>5️⃣ Get personalized tasks and recommendations.</p>

        </div>

      )}

    </main>
  );
}

/* ============================================================
   ADMIN PANEL
============================================================ */

  return (

    <main className="dashboard">

      <div className="dashboard-header">

        <div>
          <h1>Admin Panel 🛠️</h1>
          <p>Manage ScreenSense AI users.</p>
        </div>

      </div>

      <div className="grid stats">

        <div className="card">

          <div className="stat-title">
            Registered Users
          </div>

          <div className="stat-value">
            {users.length}
          </div>

        </div>

        <div className="card">

          <div className="stat-title">
            Platform
          </div>

          <div className="stat-value">
            Active
          </div>

        </div>

        <div className="card">

          <div className="stat-title">
            AI Engine
          </div>

          <div className="stat-value">
            Rule AI
          </div>

        </div>

        <div className="card">

          <div className="stat-title">
            Database
          </div>

          <div className="stat-value">
            Local
          </div>

        </div>

      </div>

      <br />

      <div className="card">

        <h2>Registered Users</h2>

        <div className="table-wrapper">

          <table>

            <thead>

              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
              </tr>

            </thead>

            <tbody>

              {users.map(user => (

/* ============================================================
   MAIN APP
============================================================ */

function App() {

  const [page, setPage] = useState(
    getCurrentUser() ? "dashboard" : "home"
  );

  const [user, setUser] = useState(
    getCurrentUser()
  );

  return (

    <div className="app">

      <Navbar
        user={user}
        setPage={setPage}
      />

      {page === "home" && (
        <Home setPage={setPage} />
      )}

      {page === "login" && (
        <Auth
          mode="login"
          setPage={setPage}
          setUser={setUser}
        />
      )}

      {page === "signup" && (
        <Auth
          mode="signup"
          setPage={setPage}
          setUser={setUser}
        />
      )}

      {page === "dashboard" && user && (
        <Dashboard user={user} />
      )}

      {page === "admin" &&
       user &&
       user.email === "admin@screensense.ai" && (
        <Admin />
      )}

    </div>
  );
}

ReactDOM.createRoot(
  document.getElementById("root")
).render(<App />);

</script>

</body>
